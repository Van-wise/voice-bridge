<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Voice Bridge · 设备设置</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --orange: #ea580c;
      --orange-light: #fff7ed;
      --red: #dc2626;
      --red-light: #fef2f2;
      --yellow: #ca8a04;
      --yellow-light: #fefce8;
      --gray: #6b7280;
      --gray-light: #f3f4f6;
      --border: #e5e7eb;
      --bg: #f0f4f8;
      --text: #111827;
      --card-shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 80px;
    }

    /* ── 顶部 Logo ── */
    .logo { text-align: center; padding: 12px 0 24px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: var(--blue); }
    .logo p { font-size: 13px; color: var(--gray); margin-top: 3px; }

    /* ── 卡片 ── */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0,0,0,.04);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── 信息行 ── */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .lbl { color: var(--gray); flex-shrink: 0; }
    .info-row .val { font-weight: 600; font-family: "SF Mono", monospace; font-size: 13px; text-align: right; }
    .info-row .val.link { color: var(--blue); cursor: pointer; }
    .info-row .val.highlight { color: var(--blue); font-weight: 700; }
    .info-row .val.dimmed { color: var(--gray); font-weight: 400; opacity: 0.6; }
    /* 地址链接：统一蓝色，等宽字体，可点击 */
    .addr-link {
      color: var(--blue);
      font-weight: 600;
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 13px;
      text-decoration: none;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--blue-light);
      transition: background .15s;
    }
    .addr-link:hover { background: #dbeafe; text-decoration: underline; }
    .info-row .val a { color: inherit; text-decoration: none; }
    .info-row .val a:hover { text-decoration: underline; }

    /* ── 步骤进度条 ── */
    .step-track {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .step-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step-node::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }
    .step-node:last-child::before { display: none; }
    .step-node.done::before { background: var(--green); }
    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      color: var(--gray);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      position: relative;
      transition: background .3s, color .3s;
    }
    .step-circle.active  { background: var(--blue); color: #fff; }
    .step-circle.done    { background: var(--green); color: #fff; }
    .step-label { font-size: 11px; color: var(--gray); margin-top: 5px; text-align: center; }

    /* ── 提示框 ── */
    .alert {
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .alert-blue   { background: var(--blue-light); color: #1d4ed8; border-left: 3px solid var(--blue); }
    .alert-green  { background: var(--green-light); color: #15803d; border-left: 3px solid var(--green); }
    .alert-orange { background: var(--orange-light); color: #9a3412; border-left: 3px solid var(--orange); }
    .alert-yellow { background: var(--yellow-light); color: #713f12; border-left: 3px solid var(--yellow); }
    .alert-red    { background: var(--red-light); color: #991b1b; border-left: 3px solid var(--red); }

    /* ── 按钮 ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
      margin-top: 10px;
      -webkit-appearance: none;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-primary   { background: var(--blue); color: #fff; }
    .btn-secondary { background: var(--blue-light); color: var(--blue); }
    .btn-green     { background: var(--green); color: #fff; }
    .btn-gray      { background: var(--gray-light); color: var(--text); }
    .btn-danger    { background: var(--red-light); color: var(--red); }
    .btn:disabled  { opacity: .5; cursor: not-allowed; }
    .btn-small { padding: 10px 14px; font-size: 14px; }

    /* ── 安装步骤 ── */
    .install-steps { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .i-step { display: flex; gap: 10px; align-items: flex-start; }
    .i-num {
      width: 22px; height: 22px;
      background: var(--blue); color: #fff;
      border-radius: 50%;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .i-body { font-size: 13px; line-height: 1.6; }
    .i-body code { background: var(--gray-light); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

    /* ── 输入框 ── */
    .input-group { margin: 12px 0 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      color: var(--text);
      background: #fff;
      -webkit-appearance: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--blue); }
    .input-hint { font-size: 12px; color: var(--gray); margin-top: 5px; }

    /* ── 成功态 ── */
    .device-named { text-align: center; padding: 8px 0 4px; }
    .device-named .name-big { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .device-named .name-sub { font-size: 13px; color: var(--gray); }

    /* ── 隐藏 ── */
    .hidden { display: none !important; }

    /* ── 加载中 ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      font-size: 15px;
    }
    .loading .spin {
      display: inline-block;
      animation: spin 1s linear infinite;
      font-size: 32px;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .tip { font-size: 12px; margin-top: 8px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      background: #111; color: #fff;
      padding: 10px 22px;
      border-radius: 99px;
      font-size: 14px;
      z-index: 9999;
      white-space: nowrap;
      transition: opacity .4s;
    }

    /* ── 按钮组 ── */
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-group .btn { flex: 1; margin-top: 0; }

    /* ── 证书状态徽章 ── */
    .cert-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .cert-badge.unknown  { background: var(--gray-light); color: var(--gray); }
    .cert-badge.untrusted { background: var(--red-light); color: var(--red); }
    .cert-badge.trusted  { background: var(--green-light); color: var(--green); }
  </style>
</head>
<body>

<div class="logo">
  <h1>🌉 Voice Bridge</h1>
  <p>设备初始化向导</p>
</div>

<!-- 加载中 -->
<div id="loading" class="loading">
  <div class="spin">⚙️</div>
  <div id="loadingText">正在识别设备…</div>
  <div class="tip">请稍候</div>
</div>

<!-- 主内容 -->
<div id="main" class="hidden">

  <!-- 步骤进度 -->
  <div class="card">
    <div class="step-track">
      <div class="step-node" id="step1Node">
        <div class="step-circle" id="sc1">1</div>
        <div class="step-label">命名设备</div>
      </div>
      <div class="step-node" id="step2Node">
        <div class="step-circle" id="sc2">2</div>
        <div class="step-label">安装证书</div>
      </div>
      <div class="step-node" id="step3Node">
        <div class="step-circle" id="sc3">3</div>
        <div class="step-label">开始使用</div>
      </div>
    </div>
  </div>

  <!-- 连接信息 -->
  <div class="card">
    <div class="card-title">📡 服务地址</div>
    <div class="info-row">
      <span class="lbl">HTTP 局域网</span>
      <span class="val" id="httpAddr">…</span>
    </div>
    <div class="info-row">
      <span class="lbl">HTTPS 局域网</span>
      <span class="val" id="httpsAddr">…</span>
    </div>
  </div>

  <!-- 步骤1：设备命名 -->
  <div class="card" id="nameCard">
    <div class="card-title">✏️ 第 1 步：给设备起名</div>
    <div id="nameBody"></div>
  </div>

  <!-- 步骤2：证书安装 -->
  <div class="card" id="certCard">
    <div class="card-title">🔒 第 2 步：安装证书</div>
    <div id="certBody"></div>
  </div>

  <!-- 步骤3：开始使用 -->
  <div class="card" id="enterCard">
    <div class="card-title">🚀 第 3 步：开始使用</div>
    <div id="enterBody"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  常量
  // ============================================================
  const HTTP_PORT  = 7266
  const HTTPS_PORT = 7267
  const IS_HTTPS   = location.protocol === 'https:'
  const HOST       = location.hostname
  const PORT       = location.port
  const API_BASE   = `${location.protocol}//${HOST}:${PORT}`

  // localStorage keys
  const DEVICE_ID_KEY    = 'vb_device_id'
  const DEVICE_NAME_KEY  = 'vb_device_name'
  const DEVICE_FP_KEY    = 'vb_device_fingerprint'
  const ONBOARDING_KEY   = 'vb_onboarding_done'
  const CERT_TRUSTED_KEY    = 'vb_cert_trusted'
  const CERT_DOWNLOADED_KEY = 'vb_cert_downloaded'

  // ============================================================
  //  状态
  // ============================================================
  let serverIp     = HOST
  let deviceId     = ''
  let deviceName   = ''
  let deviceFp     = ''
  let certStatus   = 'unknown'  // unknown / not_trusted / trusted
  let currentStep  = 1
  let nameEdited   = false      // 是否已修改过名称（只允许修改一次后永久保存）
  let httpsHealthy = false      // HTTPS 健康检查结果
  let certCheckTimer = null     // 证书状态定时刷新

  // ============================================================
  //  工具函数
  // ============================================================
  const $ = id => document.getElementById(id)
  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')

  const isIOS     = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  const isAndroid = () => /android/i.test(navigator.userAgent)
  const isMobile  = () => isIOS() || isAndroid()

  function toast(msg) {
    let t = document.querySelector('.toast')
    if (t) t.remove()
    t = document.createElement('div')
    t.className = 'toast'
    t.textContent = msg
    document.body.appendChild(t)
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400) }, 2200)
  }

  function showLoading(text) {
    const el = $('loadingText')
    if (el) el.textContent = text || '正在初始化…'
  }

  // ============================================================
  //  UUID 生成
  // ============================================================
  function generateUUID() {
    if (crypto.randomUUID) return crypto.randomUUID()
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16)
    })
  }

  // ============================================================
  //  设备指纹生成（纯原生，无外部依赖）
  //  Canvas + UA + 屏幕 + 语言 + 时区 → SHA-256
  // ============================================================
  async function generateFingerprint() {
    const cached = localStorage.getItem(DEVICE_FP_KEY)
    if (cached) return cached

    try {
      const canvas = document.createElement('canvas')
      const ctx = canvas.getContext('2d')
      canvas.width = 200; canvas.height = 50
      ctx.textBaseline = 'top'
      ctx.font = "14px 'Arial'"
      ctx.fillStyle = '#f60'
      ctx.fillRect(125, 1, 62, 20)
      ctx.fillStyle = '#069'
      ctx.fillText('VoiceBridge 🌉', 2, 15)
      ctx.fillStyle = 'rgba(102,204,0,0.7)'
      ctx.fillText('Device FP', 4, 17)
      const canvasData = canvas.toDataURL()

      const fpData = [
        canvasData,
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        navigator.language,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || '',
        navigator.platform || ''
      ].join('|')

      const msgBuffer = new TextEncoder().encode(fpData)
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer)
      const hashHex = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0')).join('')

      localStorage.setItem(DEVICE_FP_KEY, hashHex)
      return hashHex
    } catch (e) {
      const fallback = generateUUID().replace(/-/g, '')
      localStorage.setItem(DEVICE_FP_KEY, fallback)
      return fallback
    }
  }

  // ============================================================
  //  设备 ID 管理
  // ============================================================
  function getOrCreateDeviceId() {
    let id = localStorage.getItem(DEVICE_ID_KEY)
    if (!id) {
      id = generateUUID()
      localStorage.setItem(DEVICE_ID_KEY, id)
    }
    return id
  }

  function getDeviceName() {
    return localStorage.getItem(DEVICE_NAME_KEY) || ''
  }

  function saveDeviceName(name) {
    localStorage.setItem(DEVICE_NAME_KEY, name)
  }

  function markOnboardingDone() {
    localStorage.setItem(ONBOARDING_KEY, '1')
  }

  function markCertTrusted() {
    localStorage.setItem(CERT_TRUSTED_KEY, '1')
  }

  function isCertTrustedLocal() {
    return localStorage.getItem(CERT_TRUSTED_KEY) === '1'
  }

  function isCertDownloaded() {
    return localStorage.getItem(CERT_DOWNLOADED_KEY) === '1'
  }

  function markCertDownloaded() {
    localStorage.setItem(CERT_DOWNLOADED_KEY, '1')
  }

  // ============================================================
  //  HTTPS 健康检查（无感知，3秒自动刷新）
  // ============================================================
  async function httpsHealthCheck() {
    try {
      const ctrl = new AbortController()
      const t = setTimeout(() => ctrl.abort(), 2500)
      const res = await fetch(`https://${serverIp}:${HTTPS_PORT}/api/health`, {
        signal: ctrl.signal,
        mode: 'cors',
        cache: 'no-store'
      })
      clearTimeout(t)
      httpsHealthy = res.ok
    } catch (e) {
      httpsHealthy = false
    }
    // 动态更新证书状态提示（不重绘整个卡片）
    updateCertStatusBox()
  }

  function startCertStatusPolling() {
    if (certCheckTimer) clearInterval(certCheckTimer)
    httpsHealthCheck()  // 立即检测一次
    certCheckTimer = setInterval(httpsHealthCheck, 3000)
  }

  // ============================================================
  //  心跳上报（维持在线状态，10秒间隔）
  // ============================================================
  let heartbeatTimer = null

  function startHeartbeat() {
    if (heartbeatTimer) clearInterval(heartbeatTimer)
    const sendBeat = () => {
      if (!deviceId) return
      fetch(`${API_BASE}/api/admin/device/${encodeURIComponent(deviceId)}/heartbeat`, {
        method: 'POST',
        keepalive: true
      }).catch(() => {})
    }
    sendBeat()  // 立即上报一次
    heartbeatTimer = setInterval(sendBeat, 10000)
  }

  // ============================================================
  //  生成默认设备名（如"手机-192.168.1.10"或"电脑-192.168.1.5"）
  // ============================================================
  function makeDefaultDeviceName() {
    const prefix = isMobile() ? '手机' : '电脑'
    const ip = HOST.split('.').slice(-1)[0]  // 取IP最后一段更简洁
    return `${prefix}-${HOST}`
  }

  function updateCertStatusBox() {
    const box = document.getElementById('certStatusBox')
    if (!box) return
    const downloaded = isCertDownloaded()
    if (httpsHealthy) {
      box.className = 'alert alert-green cert-status-box'
      box.innerHTML = '🟢 证书已安装，可正常访问 HTTPS 安全模式'
      // 已通过健康检查 → 标记信任
      markCertTrusted()
    } else if (downloaded) {
      box.className = 'alert alert-yellow cert-status-box'
      box.innerHTML = '🟡 证书已下载，尚未完成系统安装，请按步骤安装后刷新'
    } else {
      box.className = 'alert alert-orange cert-status-box'
      box.innerHTML = '🟠 证书未下载，HTTPS 安全模式无法使用'
    }
  }

  // ============================================================
  //  API 调用（带超时）
  // ============================================================
  async function fetchJSON(url, options = {}) {
    const controller = new AbortController()
    const timeout = setTimeout(() => controller.abort(), options.timeout || 3000)
    try {
      const res = await fetch(url, { ...options, signal: controller.signal })
      clearTimeout(timeout)
      const ct = res.headers.get('content-type') || ''
      if (ct.includes('application/json')) return res.json()
      return null
    } catch (e) {
      clearTimeout(timeout)
      return null
    }
  }

  async function postJSON(url, body) {
    return fetchJSON(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      timeout: 3000
    })
  }

  // ============================================================
  //  初始化（异步非阻塞）
  // ============================================================
  async function init() {
    // HTTPS 直接进首页，禁止重复引导
    if (IS_HTTPS) {
      // HTTPS 模式：已命名设备直接跳首页
      const existingName = getDeviceName()
      if (existingName) {
        showLoading('已完成设置，正在跳转…')
        setTimeout(() => {
          window.location.replace(`https://${HOST}:${HTTPS_PORT}`)
        }, 400)
        return
      }
    }

    showLoading('正在生成设备标识…')

    // 1. 并行生成指纹 + 获取设备 ID
    deviceFp   = await generateFingerprint()
    deviceId   = getOrCreateDeviceId()
    deviceName = getDeviceName()

    showLoading('正在连接服务器…')

    // 2. 获取服务器信息（非阻塞，失败也没关系）
    const serverInfo = await fetchJSON(`${API_BASE}/api/setup/info`).catch(() => null)
    if (serverInfo && serverInfo.server_ip) {
      serverIp = serverInfo.server_ip
    }

    showLoading('正在自动识别设备…')

    // 3. 如果本 localStorage 没有设备名，通过指纹匹配服务端是否有记录
    if (!deviceName && deviceFp) {
      const matchResult = await postJSON(`${API_BASE}/api/device/auto-match`, {
        device_fingerprint: deviceFp,
        current_ip: HOST
      }).catch(() => null)

      if (matchResult && matchResult.ok && matchResult.is_found) {
        // 自动恢复设备信息（无感知）
        deviceId   = matchResult.device_id
        deviceName = matchResult.device_name || ''
        localStorage.setItem(DEVICE_ID_KEY, deviceId)
        if (deviceName) saveDeviceName(deviceName)

        // 已匹配 + HTTPS → 跳首页
        if (IS_HTTPS && deviceName) {
          showLoading('已识别设备，正在跳转…')
          setTimeout(() => {
            window.location.replace(`https://${HOST}:${HTTPS_PORT}`)
          }, 400)
          return
        }
      }
    }

    // 4. 确认 certStatus
    certStatus = IS_HTTPS ? (isCertTrustedLocal() ? 'trusted' : 'not_trusted') : 'not_trusted'

    // 5. 显示页面
    $('loading').classList.add('hidden')
    $('main').classList.remove('hidden')

    renderAll()

    // 6. 启动证书状态轮询（后台无感知）
    startCertStatusPolling()

    // 7. 已有设备名时启动心跳
    if (deviceName && deviceId) startHeartbeat()
  }

  // ============================================================
  //  渲染
  // ============================================================
  function renderAll() {
    renderAddress()
    renderSteps()
    renderName()
    renderCert()
    renderEnter()
  }

  function renderAddress() {
    // 统一用服务端局域网 IP，绝不使用 127.0.0.1
    const httpUrl  = `http://${serverIp}:${HTTP_PORT}`
    const httpsUrl = `https://${serverIp}:${HTTPS_PORT}`

    const httpEl  = $('httpAddr')
    const httpsEl = $('httpsAddr')

    // 统一蓝色链接样式，新标签页打开
    httpEl.innerHTML  = `<a class="addr-link" href="${httpUrl}" target="_blank" rel="noopener">${httpUrl}</a>`
    httpsEl.innerHTML = `<a class="addr-link" href="${httpsUrl}" target="_blank" rel="noopener">${httpsUrl}</a>`

    httpEl.className  = 'val'
    httpsEl.className = 'val'
  }

  function renderSteps() {
    if (!deviceName) {
      currentStep = 1
    } else if (certStatus !== 'trusted' && !isCertTrustedLocal()) {
      currentStep = 2
    } else {
      currentStep = 3
    }

    const steps = [
      { el: $('sc1'), node: $('step1Node') },
      { el: $('sc2'), node: $('step2Node') },
      { el: $('sc3'), node: $('step3Node') }
    ]

    steps.forEach((s, i) => {
      s.el.className = 'step-circle'
      s.node.classList.remove('done')

      if (i + 1 < currentStep) {
        s.el.classList.add('done')
        s.el.textContent = '✓'
        s.node.classList.add('done')
      } else if (i + 1 === currentStep) {
        s.el.classList.add('active')
        s.el.textContent = i + 1
      } else {
        s.el.textContent = i + 1
      }
    })
  }

  function renderName() {
    const el = $('nameBody')

    if (deviceName) {
      el.innerHTML = `
        <div class="device-named">
          <div class="name-big">🏷️ ${esc(deviceName)}</div>
          <div class="name-sub">当前设备名称</div>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="修改名称…" maxlength="32" value="${esc(deviceName)}">
          <p class="input-hint">最多 32 个字符，支持中文、英文、emoji</p>
        </div>
        <button class="btn btn-secondary btn-small" onclick="saveName()">💾 保存修改</button>`
    } else {
      const defaultName = makeDefaultDeviceName()
      el.innerHTML = `
        <div class="alert alert-blue">给你的设备起个名字，方便识别（仅需设置一次）。</div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="例如：小明的手机、iPad Pro…" maxlength="32" value="${esc(defaultName)}">
          <p class="input-hint">已自动生成默认名称，可直接修改后确认</p>
        </div>
        <button class="btn btn-primary" onclick="saveName()" id="saveBtnEl">✅ 确认命名</button>`
      setTimeout(() => {
        const inp = document.getElementById('nameInput')
        if (inp) { inp.focus(); inp.select() }
      }, 100)
    }
  }

  function renderCert() {
    const el = $('certBody')
    // 证书下载链接使用服务端 IP（HTTP端口），确保手机也能下载
    const certUrl = `http://${serverIp}:${HTTP_PORT}/api/cert/download`

    const trustedLocally = isCertTrustedLocal()

    // HTTPS + 已信任：直接显示绿色成功状态
    if (IS_HTTPS && trustedLocally) {
      certStatus = 'trusted'
      el.innerHTML = `
        <div class="alert alert-green">✅ 证书已信任，HTTPS 安全连接正常。</div>`
      return
    }

    // 统一的四步安装说明（手机/电脑完全一致）
    // iOS 和 Android 略有差异，桌面端与 Android 相同步骤风格
    let platformNote = ''
    let platformBtn  = `<a href="${certUrl}" class="btn btn-primary" download="VoiceBridge.crt"
      onclick="onCertDownloadClick()">⬇️ 下载证书</a>`

    if (isIOS()) {
      platformNote = `
        <div class="i-step"><div class="i-num">2</div>
          <div class="i-body">在 <strong>Safari</strong> 中打开下载的证书 → 前往「设置」→「通用」→「VPN与设备管理」→ 安装描述文件</div></div>
        <div class="i-step"><div class="i-num">3</div>
          <div class="i-body">「设置」→「通用」→「关于本机」→「证书信任设置」→ 开启 VoiceBridge 完全信任</div></div>
        <div class="i-step"><div class="i-num">4</div>
          <div class="i-body">💡 若提示「证书无私钥」或要求输入 PIN / 指纹，<strong>直接点确认</strong>即可<br>
            <small>（该提示为系统安全校验，不影响证书安装和 HTTPS 使用，无需额外密钥/密码）</small></div></div>`
      platformBtn = `<a href="${certUrl}" class="btn btn-primary" download="VoiceBridge.crt"
        onclick="onCertDownloadClick()">⬇️ 下载证书（请用 Safari 打开）</a>`
    } else if (isAndroid()) {
      platformNote = `
        <div class="i-step"><div class="i-num">2</div>
          <div class="i-body">下载完成 → 在通知栏或文件管理器中点击证书文件</div></div>
        <div class="i-step"><div class="i-num">3</div>
          <div class="i-body">系统弹出安装向导 → 输入 PIN / 指纹解锁 → 选择「CA 证书」→ 确认安装</div></div>
        <div class="i-step"><div class="i-num">4</div>
          <div class="i-body">💡 若提示「无私钥」，<strong>直接点确认</strong>即可<br>
            <small>（该提示为系统安全校验，不影响证书安装和 HTTPS 使用，无需额外密钥/密码）</small></div></div>`
    } else {
      // 桌面端：与手机端完全统一的四步说明
      platformNote = `
        <div class="i-step"><div class="i-num">2</div>
          <div class="i-body">双击下载的 <code>VoiceBridge.crt</code> 文件，打开安装向导</div></div>
        <div class="i-step"><div class="i-num">3</div>
          <div class="i-body">选择安装到「受信任的根证书颁发机构」→ 点击确认完成安装</div></div>
        <div class="i-step"><div class="i-num">4</div>
          <div class="i-body">💡 若提示「无私钥」或输入 PIN / 指纹，<strong>直接点确认</strong>即可<br>
            <small>（该提示为系统安全校验，不影响证书安装和 HTTPS 使用，无需额外密钥/密码）</small></div></div>`
    }

    el.innerHTML = `
      <div class="alert alert-orange">⚠️ 安装证书后方可使用 HTTPS 安全模式（手机麦克风必需）</div>
      <div class="install-steps">
        <div class="i-step"><div class="i-num">1</div>
          <div class="i-body">点击下方按钮，下载证书文件 <code>VoiceBridge.crt</code></div></div>
        ${platformNote}
      </div>
      ${platformBtn}
      <div id="certStatusBox" class="alert alert-orange cert-status-box" style="margin-top:12px">
        🟠 证书未下载，HTTPS 安全模式无法使用
      </div>`
  }

  function renderEnter() {
    const el = $('enterBody')
    const httpsUrl = `https://${serverIp}:${HTTPS_PORT}`
    const httpUrl  = `http://${serverIp}:${HTTP_PORT}`

    if (!deviceName) {
      el.innerHTML = `<p style="font-size:13px;color:var(--gray)">请先完成设备命名。</p>`
      return
    }

    if (IS_HTTPS) {
      el.innerHTML = `
        <div class="alert alert-green">
          🎉 <strong>设置完成！</strong>您的设备已就绪。
        </div>
        <button class="btn btn-green" onclick="gotoMain()">🚀 进入 Voice Bridge</button>`
    } else {
      const certReady = isCertTrustedLocal()
      el.innerHTML = `
        <div class="alert alert-yellow">选择进入方式：</div>
        <button class="btn btn-primary" onclick="gotoHttps()">
          🔒 进入 HTTPS 安全模式
        </button>
        <button class="btn btn-gray" onclick="gotoMain()" style="margin-top:8px">
          🚀 继续使用 HTTP（功能受限）
        </button>
        <p style="font-size:12px;color:var(--gray);margin-top:10px;text-align:center">
          手机麦克风功能需要 HTTPS 模式
        </p>`
    }
  }

  // ============================================================
  //  行动函数
  // ============================================================
  window.saveName = async function () {
    const input = document.getElementById('nameInput')
    const name  = input ? input.value.trim() : ''
    if (!name) { toast('⚠️ 请输入名称'); return }
    if (name.length > 32) { toast('⚠️ 名称最多32字符'); return }

    const btn = document.getElementById('saveBtnEl')
    if (btn) { btn.disabled = true; btn.textContent = '保存中…' }

    saveDeviceName(name)
    deviceName = name

    // 同步到服务器（先设置名称，再注册设备）
    await Promise.all([
      postJSON(`${API_BASE}/api/setup/name`, { device_id: deviceId, name }).catch(() => null),
      postJSON(`${API_BASE}/api/device/register`, {
        device_id: deviceId,
        device_name: name,
        device_type: isMobile() ? 'mobile' : 'desktop',
        device_fingerprint: deviceFp
      }).catch(() => null)
    ])

    // 启动心跳
    startHeartbeat()

    renderAll()
    toast('✅ 设备名称已保存')
  }

  window.markTrustedAndRerender = function () {
    markCertTrusted()
    certStatus = 'trusted'
    renderAll()
    toast('✅ 已标记证书信任')
  }

  window.onCertDownloadClick = function () {
    markCertDownloaded()
    // 300ms 后更新状态提示
    setTimeout(updateCertStatusBox, 300)
  }

  window.gotoHttps = function () {
    markOnboardingDone()
    // 直接跳 HTTPS 首页，不跳引导页
    window.location.href = `https://${serverIp}:${HTTPS_PORT}`
  }

  window.gotoHttp = function () {
    markOnboardingDone()
    // HTTP 也用局域网 IP，不用 127.0.0.1
    window.location.href = `http://${serverIp}:${HTTP_PORT}`
  }

  window.gotoMain = function () {
    markOnboardingDone()
    if (IS_HTTPS) {
      window.location.href = `https://${serverIp}:${HTTPS_PORT}`
    } else {
      window.location.href = `http://${serverIp}:${HTTP_PORT}`
    }
  }

  // ============================================================
  //  启动
  // ============================================================
  init()
})()
</script>
</body>
</html>
