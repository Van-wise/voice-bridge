<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Voice Bridge · 设备设置</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --orange: #ea580c;
      --orange-light: #fff7ed;
      --red: #dc2626;
      --red-light: #fef2f2;
      --yellow: #ca8a04;
      --yellow-light: #fefce8;
      --gray: #6b7280;
      --gray-light: #f3f4f6;
      --border: #e5e7eb;
      --bg: #f0f4f8;
      --text: #111827;
      --card-shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 80px;
    }

    /* ── 顶部 Logo ── */
    .logo { text-align: center; padding: 12px 0 24px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: var(--blue); }
    .logo p { font-size: 13px; color: var(--gray); margin-top: 3px; }

    /* ── 顶部流程导航 ── */
    .top-nav {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      max-width: 480px;
      margin: 0 auto 14px;
      padding: 10px 14px;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-wrap: wrap;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 8px;
      text-decoration: none;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .nav-item:hover { background: var(--gray-light); }
    .nav-item.active { color: var(--blue); }
    .nav-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--border);
      color: var(--gray);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .3s, color .3s;
    }
    .nav-dot.done { background: var(--green); color: #fff; }
    .nav-dot.active { background: var(--blue); color: #fff; }
    .nav-arrow { color: var(--border); font-size: 18px; user-select: none; }

    /* ── 连接信息卡片 ── */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0,0,0,.04);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── 可折叠卡片 ── */
    .vb-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0,0,0,.04);
      max-width: 480px;
      margin: 0 auto 14px;
      overflow: hidden;
      transition: box-shadow .2s;
    }
    .vb-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .vb-card-header:active { background: rgba(0,0,0,.02); }
    .vb-card-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .3s;
    }
    .vb-card-num.done { background: var(--green); }
    .vb-card-title {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .vb-card-chevron {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform .25s ease;
      color: var(--gray);
    }
    .vb-card-chevron.expanded { transform: rotate(0deg); }
    .vb-card-chevron.collapsed { transform: rotate(-90deg); }
    .vb-card-body {
      padding: 0 18px 18px;
      overflow: hidden;
      transition: max-height .3s ease, opacity .25s ease;
    }
    .vb-card-body.collapsed {
      max-height: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      opacity: 0;
    }

    /* ── 信息行 ── */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .lbl { color: var(--gray); flex-shrink: 0; }
    .info-row .val { font-weight: 600; font-family: "SF Mono", monospace; font-size: 13px; text-align: right; }
    .info-row .val.link { color: var(--blue); cursor: pointer; }
    .info-row .val.highlight { color: var(--blue); font-weight: 700; }
    .info-row .val.dimmed { color: var(--gray); font-weight: 400; opacity: 0.6; }
    .addr-link {
      color: var(--blue);
      font-weight: 600;
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 13px;
      text-decoration: none;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--blue-light);
      transition: background .15s;
    }
    .addr-link:hover { background: #dbeafe; text-decoration: underline; }
    .info-row .val a { color: inherit; text-decoration: none; }
    .info-row .val a:hover { text-decoration: underline; }

    /* ── 步骤进度条 ── */
    .step-track {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .step-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step-node::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }
    .step-node:last-child::before { display: none; }
    .step-node.done::before { background: var(--green); }
    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      color: var(--gray);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      position: relative;
      transition: background .3s, color .3s;
    }
    .step-circle.active  { background: var(--blue); color: #fff; }
    .step-circle.done    { background: var(--green); color: #fff; }
    .step-label { font-size: 11px; color: var(--gray); margin-top: 5px; text-align: center; }

    /* ── 提示框 ── */
    .alert {
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .alert-blue   { background: var(--blue-light); color: #1d4ed8; border-left: 3px solid var(--blue); }
    .alert-green  { background: var(--green-light); color: #15803d; border-left: 3px solid var(--green); }
    .alert-orange { background: var(--orange-light); color: #9a3412; border-left: 3px solid var(--orange); }
    .alert-yellow { background: var(--yellow-light); color: #713f12; border-left: 3px solid var(--yellow); }
    .alert-red    { background: var(--red-light); color: #991b1b; border-left: 3px solid var(--red); }

    /* ── 按钮 ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
      margin-top: 10px;
      -webkit-appearance: none;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-primary   { background: var(--blue); color: #fff; }
    .btn-secondary { background: var(--blue-light); color: var(--blue); }
    .btn-green     { background: var(--green); color: #fff; }
    .btn-gray      { background: var(--gray-light); color: var(--text); }
    .btn-danger    { background: var(--red-light); color: var(--red); }
    .btn:disabled  { opacity: .5; cursor: not-allowed; }
    .btn-small { padding: 10px 14px; font-size: 14px; }

    /* ── 安装步骤 ── */
    .install-steps { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .i-step { display: flex; gap: 10px; align-items: flex-start; }
    .i-num {
      width: 22px; height: 22px;
      background: var(--blue); color: #fff;
      border-radius: 50%;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .i-body { font-size: 13px; line-height: 1.6; }
    .i-body code { background: var(--gray-light); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

    /* ── 输入框 ── */
    .input-group { margin: 12px 0 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      color: var(--text);
      background: #fff;
      -webkit-appearance: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--blue); }
    .input-hint { font-size: 12px; color: var(--gray); margin-top: 5px; }

    /* ── 成功态 ── */
    .device-named { text-align: center; padding: 8px 0 4px; }
    .device-named .name-big { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .device-named .name-sub { font-size: 13px; color: var(--gray); }

    /* ── 隐藏 ── */
    .hidden { display: none !important; }

    /* ── 加载中 ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      font-size: 15px;
    }
    .loading .spin {
      display: inline-block;
      animation: spin 1s linear infinite;
      font-size: 32px;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .tip { font-size: 12px; margin-top: 8px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      background: #111; color: #fff;
      padding: 10px 22px;
      border-radius: 99px;
      font-size: 14px;
      z-index: 9999;
      white-space: nowrap;
      transition: opacity .4s;
    }

    /* ── 按钮组 ── */
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-group .btn { flex: 1; margin-top: 0; }

    /* ── 证书状态徽章 ── */
    .cert-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .cert-badge.unknown  { background: var(--gray-light); color: var(--gray); }
    .cert-badge.untrusted { background: var(--red-light); color: var(--red); }
    .cert-badge.trusted  { background: var(--green-light); color: var(--green); }

    /* ── 证书检测提示框（三态） ── */
    .cert-tip {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      transition: all .3s;
    }
    .cert-tip-icon {
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cert-tip-success { background: var(--green); color: #fff; }
    .cert-tip-success .cert-tip-icon { background: rgba(255,255,255,.25); }
    .cert-tip-error { background: var(--red); color: #fff; }
    .cert-tip-error .cert-tip-icon { background: rgba(255,255,255,.25); }
    .cert-tip-loading { background: var(--gray-light); color: var(--gray); }
    .cert-tip-loading .cert-tip-icon { animation: certSpin 1s linear infinite; }
    @keyframes certSpin { to { transform: rotate(360deg); } }

    /* ── 手动检测按钮 ── */
    .check-btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: var(--blue-light);
      color: var(--blue);
      transition: background .2s, opacity .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .check-btn:hover:not(:disabled) { background: #dbeafe; }
    .check-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="logo">
  <h1>🌉 Voice Bridge</h1>
  <p>设备初始化向导</p>
</div>

<!-- 顶部流程导航 -->
<nav class="top-nav hidden" id="topNav">
  <div class="nav-inner">
    <a class="nav-item" id="navItem1" onclick="navToCard('nameCard')">
      <span class="nav-dot" id="navDot1">1</span>
      <span>命名设备</span>
    </a>
    <div class="nav-arrow">›</div>
    <a class="nav-item" id="navItem2" onclick="navToCard('certCard')">
      <span class="nav-dot" id="navDot2">2</span>
      <span>安装证书</span>
    </a>
    <div class="nav-arrow">›</div>
    <a class="nav-item" id="navItem3" onclick="navToCard('enterCard')">
      <span class="nav-dot" id="navDot3">3</span>
      <span>开始使用</span>
    </a>
  </div>
</nav>

<!-- 加载中 -->
<div id="loading" class="loading">
  <div class="spin">⚙️</div>
  <div id="loadingText">正在识别设备…</div>
  <div class="tip">请稍候</div>
</div>

<!-- 主内容 -->
<div id="main" class="hidden">

  <!-- 连接信息 -->
  <div class="card">
    <div class="card-title">📡 服务地址</div>
    <div class="info-row">
      <span class="lbl">HTTP 局域网</span>
      <span class="val" id="httpAddr">…</span>
    </div>
    <div class="info-row">
      <span class="lbl">HTTPS 局域网</span>
      <span class="val" id="httpsAddr">…</span>
    </div>
  </div>

  <!-- 第一步：给设备命名（可折叠卡片） -->
  <div class="vb-card" id="nameCard">
    <div class="vb-card-header" onclick="toggleCard('nameCard')">
      <div class="vb-card-num" id="nameCardNum">1</div>
      <div class="vb-card-title">
        ✏️ 给设备命名
        <span class="vb-status-icon hidden" id="nameDoneIcon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="9" fill="#16a34a"/>
            <path d="M5.5 9.2l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
      <svg class="vb-card-chevron expanded" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/>
      </svg>
    </div>
    <div class="vb-card-body" id="nameBody"></div>
  </div>

  <!-- 第二步：安装证书（可折叠卡片） -->
  <div class="vb-card" id="certCard">
    <div class="vb-card-header" onclick="toggleCard('certCard')">
      <div class="vb-card-num" id="certCardNum">2</div>
      <div class="vb-card-title">🔒 安装证书</div>
      <svg class="vb-card-chevron expanded" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/>
      </svg>
    </div>
    <div class="vb-card-body" id="certBody"></div>
  </div>

  <!-- 第三步：开始使用（可折叠卡片） -->
  <div class="vb-card" id="enterCard">
    <div class="vb-card-header" onclick="toggleCard('enterCard')">
      <div class="vb-card-num" id="enterCardNum">3</div>
      <div class="vb-card-title">🚀 开始使用</div>
      <svg class="vb-card-chevron expanded" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/>
      </svg>
    </div>
    <div class="vb-card-body" id="enterBody"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  常量
  // ============================================================
  const HTTP_PORT  = 7266
  const HTTPS_PORT = 7267
  const IS_HTTPS   = location.protocol === 'https:'
  const HOST       = location.hostname
  const PORT       = location.port
  const API_BASE   = `${location.protocol}//${HOST}:${PORT}`

  // localStorage keys
  const DEVICE_ID_KEY    = 'vb_device_id'
  const DEVICE_NAME_KEY  = 'vb_device_name'
  const DEVICE_FP_KEY    = 'vb_device_fingerprint'
  const ONBOARDING_KEY   = 'vb_onboarding_done'
  const CERT_TRUSTED_KEY    = 'vb_cert_trusted'
  const CERT_DOWNLOADED_KEY = 'vb_cert_downloaded'

  // ============================================================
  //  状态
  // ============================================================
  let serverIp     = HOST
  let deviceId     = ''
  let deviceName   = ''
  let deviceFp     = ''
  let certStatus   = 'unknown'  // unknown / not_trusted / trusted
  let currentStep  = 1
  let nameEdited   = false
  let httpsHealthy = false
  let isChecking   = false  // 检测中状态

  // 卡片折叠状态
  let cardStates = { nameCard: true, certCard: true, enterCard: true }

  // ============================================================
  //  工具函数
  // ============================================================
  const $ = id => document.getElementById(id)
  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')

  const isIOS     = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  const isAndroid = () => /android/i.test(navigator.userAgent)
  const isMobile  = () => isIOS() || isAndroid()

  function toast(msg) {
    let t = document.querySelector('.toast')
    if (t) t.remove()
    t = document.createElement('div')
    t.className = 'toast'
    t.textContent = msg
    document.body.appendChild(t)
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400) }, 2200)
  }

  function showLoading(text) {
    const el = $('loadingText')
    if (el) el.textContent = text || '正在初始化…'
  }

  // ============================================================
  //  卡片折叠/展开逻辑
  // ============================================================
  function toggleCard(cardId) {
    cardStates[cardId] = !cardStates[cardId]
    updateCardUI(cardId)
  }

  function expandCard(cardId) {
    cardStates[cardId] = true
    updateCardUI(cardId)
  }

  function collapseCard(cardId) {
    cardStates[cardId] = false
    updateCardUI(cardId)
  }

  function updateCardUI(cardId) {
    const header = document.querySelector(`#${cardId} .vb-card-header`)
    const body   = document.querySelector(`#${cardId} .vb-card-body`)
    const chev   = document.querySelector(`#${cardId} .vb-card-chevron`)
    if (!header || !body || !chev) return

    const expanded = cardStates[cardId]

    if (expanded) {
      body.classList.remove('collapsed')
      chev.classList.add('expanded')
      chev.classList.remove('collapsed')
    } else {
      body.classList.add('collapsed')
      chev.classList.remove('expanded')
      chev.classList.add('collapsed')
    }
  }

  // 导航点击：跳转+展开
  window.navToCard = function(cardId) {
    const el = document.getElementById(cardId)
    if (!el) return
    expandCard(cardId)
    // 平滑滚动
    el.scrollIntoView({ behavior: 'smooth', block: 'start' })
  }

  // ============================================================
  //  UUID 生成
  // ============================================================
  function generateUUID() {
    if (crypto.randomUUID) return crypto.randomUUID()
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16)
    })
  }

  // ============================================================
  //  设备指纹生成（纯原生）
  // ============================================================
  async function generateFingerprint() {
    const cached = localStorage.getItem(DEVICE_FP_KEY)
    if (cached) return cached

    try {
      const canvas = document.createElement('canvas')
      const ctx = canvas.getContext('2d')
      canvas.width = 200; canvas.height = 50
      ctx.textBaseline = 'top'
      ctx.font = "14px 'Arial'"
      ctx.fillStyle = '#f60'
      ctx.fillRect(125, 1, 62, 20)
      ctx.fillStyle = '#069'
      ctx.fillText('VoiceBridge 🌉', 2, 15)
      ctx.fillStyle = 'rgba(102,204,0,0.7)'
      ctx.fillText('Device FP', 4, 17)
      const canvasData = canvas.toDataURL()

      const fpData = [
        canvasData,
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        navigator.language,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || '',
        navigator.platform || ''
      ].join('|')

      const msgBuffer = new TextEncoder().encode(fpData)
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer)
      const hashHex = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0')).join('')

      localStorage.setItem(DEVICE_FP_KEY, hashHex)
      return hashHex
    } catch (e) {
      const fallback = generateUUID().replace(/-/g, '')
      localStorage.setItem(DEVICE_FP_KEY, fallback)
      return fallback
    }
  }

  // ============================================================
  //  设备 ID 管理
  // ============================================================
  function getOrCreateDeviceId() {
    let id = localStorage.getItem(DEVICE_ID_KEY)
    if (!id) {
      id = generateUUID()
      localStorage.setItem(DEVICE_ID_KEY, id)
    }
    return id
  }

  function getDeviceName() {
    return localStorage.getItem(DEVICE_NAME_KEY) || ''
  }

  function saveDeviceName(name) {
    localStorage.setItem(DEVICE_NAME_KEY, name)
  }

  function markOnboardingDone() {
    localStorage.setItem(ONBOARDING_KEY, '1')
  }

  function markCertTrusted() {
    localStorage.setItem(CERT_TRUSTED_KEY, '1')
  }

  function isCertTrustedLocal() {
    return localStorage.getItem(CERT_TRUSTED_KEY) === '1'
  }

  function isCertDownloaded() {
    return localStorage.getItem(CERT_DOWNLOADED_KEY) === '1'
  }

  function markCertDownloaded() {
    localStorage.setItem(CERT_DOWNLOADED_KEY, '1')
  }

  // ============================================================
  //  HTTPS 可访问性检测（智能判断：优先前端检测，失败才调后端）
  // ============================================================
  async function httpsHealthCheck() {
    if (isChecking) return
    isChecking = true
    updateCertStatusBox()

    try {
      // 智能判断：如果当前页面已经是 https://，说明用户已点了"继续访问"
      if (location.protocol === 'https:') {
        httpsHealthy = true
      } else {
        // HTTP 协议才调后端接口检测
        const ctrl = new AbortController()
        const t = setTimeout(() => ctrl.abort(), 3000)
        const data = await fetchJSON(`${API_BASE}/api/check-https`, { signal: ctrl.signal })
        clearTimeout(t)
        httpsHealthy = !!(data && data.accessible)
      }
    } catch (e) {
      httpsHealthy = false
    } finally {
      isChecking = false
    }
    updateCertStatusBox()
    renderSteps()
    renderEnter()
  }

  // ============================================================
  //  心跳上报
  // ============================================================
  let heartbeatTimer = null

  function startHeartbeat() {
    if (heartbeatTimer) clearInterval(heartbeatTimer)
    const sendBeat = () => {
      if (!deviceId) return
      fetch(`${API_BASE}/api/admin/device/${encodeURIComponent(deviceId)}/heartbeat`, {
        method: 'POST',
        keepalive: true
      }).catch(() => {})
    }
    sendBeat()
    heartbeatTimer = setInterval(sendBeat, 10000)
  }

  // ============================================================
  //  生成默认设备名
  // ============================================================
  function makeDefaultDeviceName() {
    const prefix = isMobile() ? '手机' : '电脑'
    return `${prefix}-${HOST}`
  }

  // ============================================================
  //  证书检测提示框（三态）
  // ============================================================
  function updateCertStatusBox() {
    const box = document.getElementById('certStatusBox')
    if (!box) return

    if (isChecking) {
      box.className = 'cert-tip cert-tip-loading'
      box.innerHTML = `<span class="cert-tip-icon">⏳</span> 正在检测 HTTPS 访问…`
      box.style.display = 'flex'
      return
    }

    if (httpsHealthy) {
      box.className = 'cert-tip cert-tip-success'
      box.innerHTML = `<span class="cert-tip-icon">✓</span> 证书安装成功，可以访问 HTTPS`
      markCertTrusted()
      box.style.display = 'flex'
    } else {
      box.className = 'cert-tip cert-tip-error'
      box.innerHTML = `<span class="cert-tip-icon">!</span> 不能访问 HTTPS 模式，请安装证书`
      box.style.display = 'flex'
    }
  }

  // ============================================================
  //  API 调用（带超时）
  // ============================================================
  async function fetchJSON(url, options = {}) {
    const controller = new AbortController()
    const timeout = setTimeout(() => controller.abort(), options.timeout || 3000)
    try {
      const res = await fetch(url, { ...options, signal: controller.signal })
      clearTimeout(timeout)
      const ct = res.headers.get('content-type') || ''
      if (ct.includes('application/json')) return res.json()
      return null
    } catch (e) {
      clearTimeout(timeout)
      return null
    }
  }

  async function postJSON(url, body) {
    return fetchJSON(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      timeout: 3000
    })
  }

  // ============================================================
  //  初始化
  // ============================================================
  async function init() {
    // HTTPS 直接进首页
    if (IS_HTTPS) {
      const existingName = getDeviceName()
      if (existingName) {
        showLoading('已完成设置，正在跳转…')
        setTimeout(() => {
          window.location.replace(`https://${HOST}:${HTTPS_PORT}`)
        }, 400)
        return
      }
    }

    showLoading('正在生成设备标识…')

    // 1. 并行生成指纹 + 获取设备 ID
    deviceFp   = await generateFingerprint()
    deviceId   = getOrCreateDeviceId()
    deviceName = getDeviceName()

    showLoading('正在连接服务器…')

    // 2. 获取服务器信息
    const serverInfo = await fetchJSON(`${API_BASE}/api/setup/info`).catch(() => null)
    if (serverInfo && serverInfo.server_ip) {
      serverIp = serverInfo.server_ip
    }

    showLoading('正在自动识别设备…')

    // 3. 如果本 localStorage 没有设备名，通过指纹匹配服务端是否有记录
    if (!deviceName && deviceFp) {
      const matchResult = await postJSON(`${API_BASE}/api/device/auto-match`, {
        device_fingerprint: deviceFp,
        current_ip: HOST
      }).catch(() => null)

      if (matchResult && matchResult.ok && matchResult.is_found) {
        deviceId   = matchResult.device_id
        deviceName = matchResult.device_name || ''
        localStorage.setItem(DEVICE_ID_KEY, deviceId)
        if (deviceName) saveDeviceName(deviceName)

        if (IS_HTTPS && deviceName) {
          showLoading('已识别设备，正在跳转…')
          setTimeout(() => {
            window.location.replace(`https://${HOST}:${HTTPS_PORT}`)
          }, 400)
          return
        }
      }
    }

    // 4. 确认 certStatus
    certStatus = IS_HTTPS ? (isCertTrustedLocal() ? 'trusted' : 'not_trusted') : 'not_trusted'

    // 5. 显示页面
    $('loading').classList.add('hidden')
    $('main').classList.remove('hidden')
    $('topNav').classList.remove('hidden')

    renderAll()

    // 6. 已有设备名时启动心跳
    if (deviceName && deviceId) startHeartbeat()

    // 7. 如果已命名，折叠第一步卡片并显示对勾
    if (deviceName) {
      collapseCard('nameCard')
      updateNameDoneIcon(true)
    }
  }

  // ============================================================
  //  渲染
  // ============================================================
  function renderAll() {
    renderAddress()
    renderSteps()
    renderName()
    renderCert()
    renderEnter()
  }

  function renderAddress() {
    const httpUrl  = `http://${serverIp}:${HTTP_PORT}`
    const httpsUrl = `https://${serverIp}:${HTTPS_PORT}`

    const httpEl  = $('httpAddr')
    const httpsEl = $('httpsAddr')

    httpEl.innerHTML  = `<a class="addr-link" href="${httpUrl}" target="_blank" rel="noopener">${httpUrl}</a>`
    httpsEl.innerHTML = `<a class="addr-link" href="${httpsUrl}" target="_blank" rel="noopener">${httpsUrl}</a>`

    httpEl.className  = 'val'
    httpsEl.className = 'val'
  }

  function renderSteps() {
    // 步骤判断
    if (!deviceName) {
      currentStep = 1
    } else if (!httpsHealthy) {
      currentStep = 2
    } else {
      currentStep = 3
    }

    // 更新顶部导航
    const navDots = [
      { dot: $('navDot1'), item: $('navItem1') },
      { dot: $('navDot2'), item: $('navItem2') },
      { dot: $('navDot3'), item: $('navItem3') }
    ]

    navDots.forEach((n, i) => {
      if (!n.dot || !n.item) return
      const step = i + 1
      n.dot.className = 'nav-dot'
      n.item.classList.remove('active')

      if (step < currentStep) {
        n.dot.classList.add('done')
        n.dot.textContent = '✓'
      } else if (step === currentStep) {
        n.dot.classList.add('active')
        n.dot.textContent = step
        n.item.classList.add('active')
      } else {
        n.dot.textContent = step
      }
    })

    // 更新卡片数字圆圈
    updateCardNum('nameCard', 1)
    updateCardNum('certCard', 2)
    updateCardNum('enterCard', 3)

    // 更新卡片标题对勾（第一步）
    updateNameDoneIcon(!!deviceName)
  }

  function updateCardNum(cardId, num) {
    const numEl = document.querySelector(`#${cardId} .vb-card-num`)
    if (!numEl) return
    if (num < currentStep) {
      numEl.classList.add('done')
      numEl.innerHTML = '✓'
    } else {
      numEl.classList.remove('done')
      numEl.textContent = num
    }
  }

  function updateNameDoneIcon(show) {
    const icon = $('nameDoneIcon')
    if (icon) {
      if (show) {
        icon.classList.remove('hidden')
      } else {
        icon.classList.add('hidden')
      }
    }
  }

  function renderName() {
    const el = $('nameBody')

    if (deviceName) {
      el.innerHTML = `
        <div class="device-named">
          <div class="name-big">🏷️ ${esc(deviceName)}</div>
          <div class="name-sub">当前设备名称</div>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="修改名称…" maxlength="32" value="${esc(deviceName)}">
          <p class="input-hint">最多 32 个字符，支持中文、英文、emoji</p>
        </div>
        <button class="btn btn-secondary btn-small" onclick="saveName()">💾 保存修改</button>`
    } else {
      const defaultName = makeDefaultDeviceName()
      el.innerHTML = `
        <div class="alert alert-blue">给你的设备起个名字，方便识别（仅需设置一次）。</div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="例如：小明的手机、iPad Pro…" maxlength="32" value="${esc(defaultName)}">
          <p class="input-hint">已自动生成默认名称，可直接修改后确认</p>
        </div>
        <button class="btn btn-primary" onclick="saveName()" id="saveBtnEl">✅ 确认命名</button>`
      setTimeout(() => {
        const inp = document.getElementById('nameInput')
        if (inp) { inp.focus(); inp.select() }
      }, 100)
    }
  }

  function renderCert() {
    const el = $('certBody')
    const certUrl = `http://${serverIp}:${HTTP_PORT}/api/cert/download`

    const trustedLocally = isCertTrustedLocal()

    // HTTPS + 已信任：直接显示绿色成功状态
    if (IS_HTTPS && trustedLocally) {
      certStatus = 'trusted'
      el.innerHTML = `
        <div class="alert alert-green">✅ 证书已信任，HTTPS 安全连接正常。</div>`
      return
    }

    let platformNote = ''
    let platformBtn  = `<a href="${certUrl}" class="btn btn-primary" download="VoiceBridge.crt"
      onclick="onCertDownloadClick()">⬇️ 下载证书</a>`

    if (isIOS()) {
      platformNote = `
        <div class="i-step"><div class="i-num">2</div>
          <div class="i-body">在 <strong>Safari</strong> 中打开下载的证书 → 前往「设置」→「通用」→「VPN与设备管理」→ 安装描述文件</div></div>
        <div class="i-step"><div class="i-num">3</div>
          <div class="i-body">「设置」→「通用」→「关于本机」→「证书信任设置」→ 开启 VoiceBridge 完全信任</div></div>
        <div class="i-step"><div class="i-num">4</div>
          <div class="i-body">💡 若提示「证书无私钥」或要求输入 PIN / 指纹，<strong>直接点确认</strong>即可</div></div>`
      platformBtn = `<a href="${certUrl}" class="btn btn-primary" download="VoiceBridge.crt"
        onclick="onCertDownloadClick()">⬇️ 下载证书（请用 Safari 打开）</a>`
    } else if (isAndroid()) {
      platformNote = `
        <div class="i-step"><div class="i-num">2</div>
          <div class="i-body">下载完成 → 在通知栏或文件管理器中点击证书文件</div></div>
        <div class="i-step"><div class="i-num">3</div>
          <div class="i-body">系统弹出安装向导 → 输入 PIN / 指纹解锁 → 选择「CA 证书」→ 确认安装</div></div>
        <div class="i-step"><div class="i-num">4</div>
          <div class="i-body">💡 若提示「无私钥」，<strong>直接点确认</strong>即可</div></div>`
    } else {
      platformNote = `
        <div class="i-step"><div class="i-num">2</div>
          <div class="i-body">双击下载的 <code>VoiceBridge.crt</code> 文件，打开安装向导</div></div>
        <div class="i-step"><div class="i-num">3</div>
          <div class="i-body">选择安装到「受信任的根证书颁发机构」→ 点击确认完成安装</div></div>
        <div class="i-step"><div class="i-num">4</div>
          <div class="i-body">💡 若提示「无私钥」或输入 PIN / 指纹，<strong>直接点确认</strong>即可</div></div>`
    }

    el.innerHTML = `
      <div class="alert alert-orange">⚠️ 安装证书后方可使用 HTTPS 安全模式（手机麦克风必需）</div>
      <div class="install-steps">
        <div class="i-step"><div class="i-num">1</div>
          <div class="i-body">点击下方按钮，下载证书文件 <code>VoiceBridge.crt</code></div></div>
        ${platformNote}
      </div>
      ${platformBtn}
      <button class="check-btn" id="manualCheckBtn" onclick="manualCheckHttps()">
        🔍 检测 HTTPS 访问状态
      </button>
      <div id="certStatusBox" class="cert-tip cert-tip-loading" style="margin-top:10px; display:none">
        <span class="cert-tip-icon">⏳</span> 正在检测…
      </div>`
  }

  function renderEnter() {
    const el = $('enterBody')

    if (!deviceName) {
      el.innerHTML = `<p style="font-size:13px;color:var(--gray)">请先完成设备命名。</p>`
      return
    }

    if (httpsHealthy) {
      // HTTPS 可访问 → 绿色成功态
      el.innerHTML = `
        <button class="btn btn-green" onclick="gotoHttps()">
          🔒 进入 HTTPS 安全模式
        </button>
        <button class="btn btn-gray" onclick="gotoMain()" style="margin-top:8px">
          🚀 继续使用 HTTP（功能受限）
        </button>`
    } else {
      // HTTPS 不可访问 → HTTPS 按钮禁用
      el.innerHTML = `
        <button class="btn btn-primary" disabled style="opacity:.5;cursor:not-allowed">
          🔒 进入 HTTPS 安全模式
        </button>
        <button class="btn btn-gray" onclick="gotoMain()" style="margin-top:8px">
          🚀 继续使用 HTTP（功能受限）
        </button>
        <p style="font-size:12px;color:var(--gray);margin-top:10px;text-align:center">
          请先完成证书安装，HTTPS 检测通过后上方按钮可点击
        </p>`
    }
  }

  // ============================================================
  //  手动触发证书检测
  // ============================================================
  window.manualCheckHttps = async function () {
    const btn = document.getElementById('manualCheckBtn')
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 检测中…' }
    await httpsHealthCheck()
    if (btn) { btn.disabled = false; btn.textContent = '🔍 重新检测 HTTPS 访问' }
  }

  // ============================================================
  //  行动函数
  // ============================================================
  window.saveName = async function () {
    const input = document.getElementById('nameInput')
    const name  = input ? input.value.trim() : ''
    if (!name) { toast('⚠️ 请输入名称'); return }
    if (name.length > 32) { toast('⚠️ 名称最多32字符'); return }

    const btn = document.getElementById('saveBtnEl')
    if (btn) { btn.disabled = true; btn.textContent = '保存中…' }

    saveDeviceName(name)
    deviceName = name

    // 同步到服务器
    await Promise.all([
      postJSON(`${API_BASE}/api/setup/name`, { device_id: deviceId, name }).catch(() => null),
      postJSON(`${API_BASE}/api/device/register`, {
        device_id: deviceId,
        device_name: name,
        device_type: isMobile() ? 'mobile' : 'desktop',
        device_fingerprint: deviceFp
      }).catch(() => null)
    ])

    // 启动心跳
    startHeartbeat()

    // 保存成功后：更新步骤状态 + 显示对勾 + 折叠卡片
    renderSteps()
    updateNameDoneIcon(true)
    collapseCard('nameCard')

    toast('✅ 设备名称已保存')
  }

  window.markTrustedAndRerender = function () {
    markCertTrusted()
    certStatus = 'trusted'
    renderAll()
    toast('✅ 已标记证书信任')
  }

  window.onCertDownloadClick = function () {
    markCertDownloaded()
  }

  window.gotoHttps = function () {
    markOnboardingDone()
    window.location.href = `https://${serverIp}:${HTTPS_PORT}`
  }

  window.gotoHttp = function () {
    markOnboardingDone()
    window.location.href = `http://${serverIp}:${HTTP_PORT}`
  }

  window.gotoMain = function () {
    markOnboardingDone()
    if (IS_HTTPS) {
      window.location.href = `https://${serverIp}:${HTTPS_PORT}`
    } else {
      window.location.href = `http://${serverIp}:${HTTP_PORT}`
    }
  }

  // ============================================================
  //  启动
  // ============================================================
  init()
})()
</script>
</body>
</html>
